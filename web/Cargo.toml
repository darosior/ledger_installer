[package]
name = "ledger_manager_web"
version = "0.1.0"
authors = ["Antoine Poinsot <darosior@protonmail.com>"]
description = "Web interface for Ledger Manager - install Bitcoin app via browser"

edition.workspace = true
license-file.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ledger_manager = { path = "../ledger_manager", default-features = false, features = ["web"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlButtonElement",
    "HtmlDivElement",
    "Navigator",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
futures = "0.3"
hex = "0.4"
urlencoding = "2.1"

[lints]
workspace = true
