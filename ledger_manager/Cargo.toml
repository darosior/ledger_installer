[package]
name = "ledger_manager"
version = "0.1.0"
authors = ["Antoine Poinsot <darosior@protonmail.com>"]
keywords = ["bitcoin", "ledger", "install", "setup", "app"]
description = "Ledger Live but without the scams. Just install the Bitcoin app."

edition.workspace = true
license-file.workspace = true
readme.workspace = true

[features]
default = ["desktop"]
desktop = [
    "ledger-transport-hidapi",
    "minreq",
    "tungstenite",
]
web = [
    "wasm-bindgen",
    "wasm-bindgen-futures",
    "js-sys",
    "web-sys",
    "gloo-net",
    "gloo-timers",
    "getrandom",
]

[dependencies]
# Always included (platform-agnostic)
log = "0.4"
ledger-apdu = { version = "0.10" }
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
hex = "0.4"
form_urlencoded = "1.2.1"
thiserror = "1.0"

# Desktop-only dependencies
ledger-transport-hidapi = { version = "0.10.0", optional = true }
minreq = { version = "2.11", features = ["https", "json-using-serde"], optional = true }
tungstenite = { version = "0.21.0", features = ["rustls-tls-native-roots"], optional = true }

# Web-only dependencies
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = [
    "console",
    "Window",
    "Navigator",
    "Hid",
    "HidDevice",
    "HidDeviceFilter",
    "HidDeviceRequestOptions",
    "HidInputReportEvent",
    "HidCollectionInfo",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "BinaryType",
    "Blob",
    "ErrorEvent",
], optional = true }
gloo-net = { version = "0.6", optional = true }
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }

# Enable unstable web-sys APIs (required for WebHID)
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4"]

[lints]
workspace = true
